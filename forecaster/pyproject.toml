[project]
name = "forecaster"
version = "0.1.0"
description = "Nightly grounded digest — Emeritus capstone."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "claude-agent-sdk",
    "python-dotenv",
    # Windows ships no system tz database, so stdlib `zoneinfo` cannot resolve
    # "America/Chicago" without this. FR-3 requires UTC -> local conversion, and the
    # target machine is Windows 11, so this is required rather than optional.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
